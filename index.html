<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>처갓집 치킨 타이쿤</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f3f5; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 430px; height: 100vh; max-height: 932px; background: white; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        /* 상단 헤더 & 자산 정보 */
        .header { padding: 10px 15px; background: #fff; border-bottom: 1px solid #f1f3f5; flex-shrink: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .store-badge { background: #d9480e; color: white; padding: 3px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; }
        .header-btns { display: flex; gap: 5px; }
        .btn-sm { padding: 4px 8px; font-size: 11px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-ledger { background: #339af0; }
        .btn-book { background: #20c997; }

        .money-card { background: #fff4e6; padding: 10px 12px; border-radius: 10px; border: 1px solid #ffe8cc; text-align: center; }
        .money-title { font-size: 11px; color: #868e96; }
        .money-val { font-size: 20px; font-weight: 800; color: #d9480e; margin: 2px 0; }
        .sub-stats { font-size: 11px; color: #f59f00; display: flex; justify-content: space-around; font-weight: 600; }

        /* 버너 경고바 */
        .banner { display: none; padding: 6px; font-weight: bold; font-size: 11px; text-align: center; flex-shrink: 0; }
        .fever-banner { background: #e03131; color: white; }
        .penalty-banner { background: #495057; color: #ffc9c9; }

        .btn-event { display: none; margin: 5px 12px 0 12px; padding: 8px; font-size: 12px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; animation: pulse 0.8s infinite alternate; flex-shrink: 0; }
        .btn-fever { background: #f03e3e; }
        .btn-truck { background: #d9480e; }
        @keyframes pulse { from { opacity: 0.8; transform: scale(0.99); } to { opacity: 1; transform: scale(1.01); } }

        /* 메인 컨텐츠 영역 */
        .content { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .tab-content { display: none; height: 100%; flex-direction: column; }
        .tab-content.active { display: flex; }

        /* 메인 클릭 메인 탭 */
        .chicken-box { width: 100%; height: 170px; border-radius: 12px; background: #e9ecef; overflow: hidden; position: relative; border: 1px solid #dee2e6; margin-bottom: 10px; }
        .chicken-img { width: 100%; height: 100%; object-fit: cover; }
        .menu-title-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: white; padding: 6px; font-size: 13px; font-weight: bold; text-align: center; }

        /* 공통 버튼 */
        .btn { font-size: 13px; padding: 12px; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 8px; text-align: center; }
        .btn:disabled { background: #ced4da !important; color: #868e96; cursor: not-allowed; }
        .btn-click { background: #ff922b; font-size: 16px; padding: 16px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(255,146,43,0.3); }
        .btn-click:active { transform: scale(0.97); }
        .btn-menu { background: #4c6ef5; }
        .btn-upgrade { background: #20c997; }
        .btn-side { background: #845ef7; }
        .btn-minigame { background: #12b886; }
        .btn-store { background: #fcc419; color: #212529; }
        .btn-reset { background: #adb5bd; font-size: 11px; padding: 6px; margin-top: auto; }

        .section-title { font-size: 12px; color: #495057; margin: 8px 0 4px 0; font-weight: bold; border-left: 3px solid #ff922b; padding-left: 5px; }

        /* 하단 고정 탭 바 */
        .tab-bar { display: flex; height: 55px; border-top: 1px solid #e9ecef; background: #fff; flex-shrink: 0; }
        .tab-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 11px; color: #868e96; cursor: pointer; font-weight: bold; }
        .tab-item.active { color: #d9480e; border-top: 2px solid #d9480e; }
        .tab-icon { font-size: 16px; margin-bottom: 2px; }

        /* Floating 클릭 효과 */
        .float-text { position: absolute; font-weight: bold; font-size: 16px; color: #d9480e; pointer-events: none; animation: floatUp 0.7s ease-out forwards; z-index: 50; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }

        /* 모달 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 18px; border-radius: 12px; width: 85%; max-width: 360px; max-height: 75vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f3f5; padding-bottom: 8px; margin-bottom: 10px; }
        .close-btn { cursor: pointer; font-weight: bold; font-size: 16px; color: #868e96; }
        .ledger-item { padding: 6px 0; border-bottom: 1px dashed #e9ecef; font-size: 12px; display: flex; justify-content: space-between; }
        .book-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .book-card { border: 1px solid #dee2e6; border-radius: 6px; padding: 8px; text-align: center; font-size: 11px; background: #f8f9fa; }
        .book-card.locked { opacity: 0.4; filter: grayscale(100%); }

        /* 미니게임 요솟값 */
        .flyer-target { position: absolute; width: 45px; height: 45px; background: #ff922b; color: white; font-weight: bold; font-size: 11px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 60; }
    </style>
</head>
<body>

<div class="app-container" id="main-card">
    <!-- 헤더 영역 -->
    <div class="header">
        <div class="top-bar">
            <span id="store-badge" class="store-badge">🍗 1호점 운영 중</span>
            <div class="header-btns">
                <button class="btn-sm btn-ledger" onclick="openLedger()">📊 장부</button>
                <button class="btn-sm btn-book" onclick="openBook()">📖 도감</button>
            </div>
        </div>
        <div class="money-card">
            <div class="money-title">총 자산</div>
            <div class="money-val"><span id="money-text">0</span>원</div>
            <div class="sub-stats">
                <span>오늘 매출: <span id="daily-money-text">0</span>원</span>
                <span>초당: <span id="cps-text">0</span>원</span>
            </div>
        </div>
    </div>

    <!-- 이벤트 버너 -->
    <div id="fever-banner" class="banner fever-banner">🔥 대형 유튜버 방문! 수익 5배 폭증! (<span id="fever-time">10</span>s)</div>
    <div id="penalty-banner" class="banner penalty-banner">⚠️ 고객 클레임! 매출 30% 감소 중 (<span id="penalty-time">15</span>s)</div>

    <button id="fever-btn" class="btn-event btn-fever" onclick="activateFever()">🎥 유튜버 매장 방문! (클릭하여 버프 시작)</button>
    <button id="truck-btn" class="btn-event btn-truck" onclick="activateTruck()">🚚 푸드트럭 챌린지! (클릭하여 매출 대폭발)</button>

    <!-- 메인 컨텐츠 영역 (탭 전환) -->
    <div class="content">
        <!-- 1. 조리/클릭 탭 -->
        <div id="tab-cook" class="tab-content active">
            <div style="font-size: 11px; color: #495057; font-weight: bold; margin-bottom: 4px;" id="day-text">📅 2026년 8월 16일</div>
            <div class="chicken-box">
                <img id="chicken-img" class="chicken-img" src="./fride.jpg" alt="치킨 이미지">
                <div id="menu-title-overlay" class="menu-title-overlay">후라이드치킨</div>
            </div>
            <button id="click-btn" class="btn btn-click" onclick="makeChicken(event)">🍗 치킨 조리 (+100원)</button>
            
            <div class="section-title">치킨 신메뉴 개발</div>
            <button id="menu-btn" class="btn btn-menu" onclick="upgradeMenu()">📜 신메뉴 개발</button>
        </div>

        <!-- 2. 업그레이드 탭 -->
        <div id="tab-upgrade" class="tab-content">
            <div class="section-title">주방 알바 고용 (초당 자동 수익)</div>
            <button id="hire-btn" class="btn btn-upgrade" onclick="hirePartTime()">👨‍🍳 주방 알바 고용</button>

            <div class="section-title">사이드 메뉴 & 장비 추가</div>
            <button id="side-btn" class="btn btn-side" onclick="buySide()">🥤 사이드 추가</button>
        </div>

        <!-- 3. 확장 및 기타 탭 -->
        <div id="tab-expand" class="tab-content">
            <div class="section-title">가게 홍보 미니게임</div>
            <button id="minigame-btn" class="btn btn-minigame" onclick="startFlyerMinigame()">📣 전단지 홍보 (10초 클릭 대작전)</button>

            <div class="section-title">가맹점 사업 확장</div>
            <button id="store-btn" class="btn btn-store" onclick="openNewStore()">🚀 가맹점 개업하기</button>

            <button class="btn btn-reset" onclick="resetGame()">데이터 초기화</button>
        </div>
    </div>

    <!-- 하단 탭 메뉴 바 -->
    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('tab-cook', this)">
            <span class="tab-icon">🍗</span>
            <span>조리/개발</span>
        </div>
        <div class="tab-item" onclick="switchTab('tab-upgrade', this)">
            <span class="tab-icon">👨‍🍳</span>
            <span>업그레이드</span>
        </div>
        <div class="tab-item" onclick="switchTab('tab-expand', this)">
            <span class="tab-icon">🚀</span>
            <span>홍보/확장</span>
        </div>
    </div>
</div>

<!-- 장부 모달 -->
<div id="ledger-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h4 style="margin:0;">📊 매출 장부 기록</h4>
            <span class="close-btn" onclick="closeModal('ledger-modal')">&times;</span>
        </div>
        <div id="ledger-list"></div>
    </div>
</div>

<!-- 도감 모달 -->
<div id="book-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h4 style="margin:0;">📖 메뉴 컬렉션 도감</h4>
            <span class="close-btn" onclick="closeModal('book-modal')">&times;</span>
        </div>
        <div class="book-grid" id="book-grid"></div>
    </div>
</div>

<script>
    const DAY_DURATION_SEC = 1800;

    const chickenMenuData = [
        { name: "후라이드치킨", img: "./fride.jpg", power: 100, cost: 0 },
        { name: "훈제치킨", img: "./bbq.jpg", power: 200, cost: 1000 },
        { name: "반반치킨", img: "./half.jpg", power: 450, cost: 3500 },
        { name: "허니올리고당야채양념치킨", img: "./flavor.jpg", power: 800, cost: 10000 },
        { name: "닭강정", img: "./point.jpg", power: 1400, cost: 25000 },
        { name: "와락간장치킨", img: "./soy.jpg", power: 2300, cost: 60000 },
        { name: "슈프림양념치킨", img: "./suprem.jpg", power: 3800, cost: 150000 },
        { name: "치즈슈프림양념치킨", img: "./cheese.jpg", power: 6000, cost: 350000 },
        { name: "핫슈프림양념치킨", img: "./hot.jpg", power: 9500, cost: 800000 },
        { name: "슈프림골드양념치킨", img: "./gold.jpg", power: 15000, cost: 1800000 },
        { name: "블랙라벨양념치킨", img: "./black.jpg", power: 24000, cost: 4000000 },
        { name: "매운불양념치킨", img: "./spicy.jpg", power: 38000, cost: 9000000 },
        { name: "100%청양산고추치킨", img: "./spicy100.jpg", power: 60000, cost: 20000000 },
        { name: "K마라양념치킨", img: "./k.jpg", power: 95000, cost: 45000000 },
        { name: "미트칠리양념치킨", img: "./meat.jpg", power: 150000, cost: 100000000 },
        { name: "세트치킨", img: "./set.jpg", power: 250000, cost: 250000000 }
    ];

    const sideUpgradeData = [
        { name: "치킨무", cps: 50, cost: 800 },
        { name: "치킨치즈볼", cps: 150, cost: 2500 },
        { name: "치즈크런치 감자튀김", cps: 350, cost: 7000 },
        { name: "어포튀김", cps: 800, cost: 18000 },
        { name: "팝만두", cps: 1800, cost: 45000 },
        { name: "꼬치없는떡꼬치", cps: 3800, cost: 100000 },
        { name: "황도", cps: 8000, cost: 250000 },
        { name: "번데기탕", cps: 16000, cost: 600000 },
        { name: "스팸계란구이", cps: 32000, cost: 1400000 },
        { name: "비빔만두", cps: 60000, cost: 3000000 },
        { name: "국물떡볶이", cps: 120000, cost: 7000000 },
        { name: "닭발튀김", cps: 230000, cost: 15000000 },
        { name: "무뼈닭발", cps: 450000, cost: 35000000 },
        { name: "김치우동", cps: 900000, cost: 80000000 },
        { name: "메밀소바", cps: 1800000, cost: 180000000 },
        { name: "먹태", cps: 3500000, cost: 400000000 },
        { name: "골뱅이무침", cps: 7000000, cost: 1000000000 }
    ];

    let money = 0;
    let dailyMoney = 0;
    let menuLevel = 0;
    let sideLevel = 0;
    let partTimeCount = 0;
    let partTimeCost = 1000;
    let storeCount = 1;
    let storeCost = 500000;

    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth() + 1;
    let currentDay = today.getDate();

    let dayTimer = DAY_DURATION_SEC;
    let salesLedger = [];

    let isFever = false;
    let feverTimeLeft = 0;
    let feverMultiplier = 1;
    let isPenalty = false;
    let penaltyTimeLeft = 0;
    let penaltyMultiplier = 1;

    let isMinigameActive = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'upgrade') {
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'event') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        el.classList.add('active');
    }

    function loadGame() {
        const savedData = localStorage.getItem("cheogajipTycoon_v11");
        if (savedData) {
            const data = JSON.parse(savedData);
            money = data.money || 0;
            dailyMoney = data.dailyMoney || 0;
            menuLevel = data.menuLevel || 0;
            sideLevel = data.sideLevel || 0;
            partTimeCount = data.partTimeCount || 0;
            partTimeCost = data.partTimeCost || 1000;
            storeCount = data.storeCount || 1;
            storeCost = data.storeCost || 500000;
            currentYear = data.currentYear || currentYear;
            currentMonth = data.currentMonth || currentMonth;
            currentDay = data.currentDay || currentDay;
            dayTimer = data.dayTimer || DAY_DURATION_SEC;
            salesLedger = data.salesLedger || [];
        }
        updateUI();
    }

    function saveGame() {
        const data = { 
            money, dailyMoney, menuLevel, sideLevel, partTimeCount, 
            partTimeCost, storeCount, storeCost, 
            currentYear, currentMonth, currentDay, dayTimer, salesLedger
        };
        localStorage.setItem("cheogajipTycoon_v11", JSON.stringify(data));
    }

    function getBaseCPS() {
        let singleStoreCps = (partTimeCount * 150);
        for (let i = 0; i < sideLevel; i++) {
            singleStoreCps += sideUpgradeData[i].cps;
        }
        return Math.floor(singleStoreCps * storeCount * feverMultiplier * penaltyMultiplier);
    }

    function spawnFloatText(e, text) {
        const card = document.getElementById("main-card");
        const floatEl = document.createElement("div");
        floatEl.className = "float-text";
        floatEl.innerText = text;

        const rect = card.getBoundingClientRect();
        const x = e.clientX ? (e.clientX - rect.left - 20) : 180;
        const y = e.clientY ? (e.clientY - rect.top - 20) : 250;

        floatEl.style.left = `${x}px`;
        floatEl.style.top = `${y}px`;

        card.appendChild(floatEl);
        setTimeout(() => floatEl.remove(), 700);
    }

    function makeChicken(e) {
        const currentMenu = chickenMenuData[menuLevel];
        const earned = Math.floor(currentMenu.power * feverMultiplier * penaltyMultiplier);
        money += earned;
        dailyMoney += earned;
        playSound('click');
        spawnFloatText(e, `+${earned.toLocaleString()}원!`);
        updateUI();
        saveGame();
    }

    function hirePartTime() {
        if (money >= partTimeCost) {
            money -= partTimeCost;
            partTimeCount++;
            partTimeCost = Math.floor(partTimeCost * 1.4);
            playSound('upgrade');
            updateUI();
            saveGame();
        }
    }

    function upgradeMenu() {
        if (menuLevel < chickenMenuData.length - 1) {
            const nextMenu = chickenMenuData[menuLevel + 1];
            if (money >= nextMenu.cost) {
                money -= nextMenu.cost;
                menuLevel++;
                playSound('upgrade');
                updateUI();
                saveGame();
            }
        }
    }

    function buySide() {
        if (sideLevel < sideUpgradeData.length) {
            const nextSide = sideUpgradeData[sideLevel];
            if (money >= nextSide.cost) {
                money -= nextSide.cost;
                sideLevel++;
                playSound('upgrade');
                updateUI();
                saveGame();
            }
        }
    }

    function openNewStore() {
        if (money >= storeCost) {
            money -= storeCost;
            storeCount++;
            storeCost = Math.floor(storeCost * 2.8);
            playSound('upgrade');
            alert(`🎉 축하합니다! ${storeCount}호 가맹점을 개업했습니다!`);
            updateUI();
            saveGame();
        }
    }

    function startFlyerMinigame() {
        if (isMinigameActive) return;
        isMinigameActive = true;
        document.getElementById("minigame-btn").disabled = true;

        let timeLeft = 10;
        const card = document.getElementById("main-card");

        const gameInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(gameInterval);
                isMinigameActive = false;
                document.getElementById("minigame-btn").disabled = false;
                document.getElementById("minigame-btn").innerText = "📣 전단지 홍보 (10초 클릭 대작전)";
                return;
            }
            
            document.getElementById("minigame-btn").innerText = `📣 홍보 진행 중! (${timeLeft}초 남음)`;
            timeLeft--;

            const target = document.createElement("div");
            target.className = "flyer-target";
            target.innerText = "전단지";
            target.style.left = `${Math.random() * 260 + 30}px`;
            target.style.top = `${Math.random() * 300 + 150}px`;

            target.onclick = (e) => {
                const bonus = Math.floor(chickenMenuData[menuLevel].power * 5);
                money += bonus;
                dailyMoney += bonus;
                playSound('click');
                spawnFloatText(e, `홍보 성공! +${bonus.toLocaleString()}원`);
                target.remove();
                updateUI();
            };

            card.appendChild(target);
            setTimeout(() => { if (target.parentNode) target.remove(); }, 1200);

        }, 1000);
    }

    setInterval(() => {
        const rand = Math.random();

        if (!isFever && rand < 0.15 && document.getElementById("fever-btn").style.display !== "block") {
            const btn = document.getElementById("fever-btn");
            btn.style.display = "block";
            playSound('event');
            setTimeout(() => { btn.style.display = "none"; }, 7000);
        }

        if (rand > 0.97 && document.getElementById("truck-btn").style.display !== "block") {
            const truckBtn = document.getElementById("truck-btn");
            truckBtn.style.display = "block";
            playSound('event');
            setTimeout(() => { truckBtn.style.display = "none"; }, 7000);
        }

        if (!isPenalty && rand > 0.85 && rand <= 0.93) {
            triggerPenaltyEvent();
        }
    }, 20000);

    function activateFever() {
        document.getElementById("fever-btn").style.display = "none";
        isFever = true;
        feverMultiplier = 5;
        feverTimeLeft = 10;
        document.getElementById("fever-banner").style.display = "block";

        const feverInterval = setInterval(() => {
            feverTimeLeft--;
            document.getElementById("fever-time").innerText = feverTimeLeft;
            if (feverTimeLeft <= 0) {
                clearInterval(feverInterval);
                isFever = false;
                feverMultiplier = 1;
                document.getElementById("fever-banner").style.display = "none";
            }
        }, 1000);
    }

    function activateTruck() {
        document.getElementById("truck-btn").style.display = "none";
        const baseVal = Math.floor(Math.random() * (10000000 - 5000000 + 1)) + 5000000;
        const truckSales = Math.floor(baseVal / 100) * 100;

        money += truckSales;
        dailyMoney += truckSales;
        alert(`🚚 [푸드트럭 행사 성공!]\n총 +${truckSales.toLocaleString()}원의 추가 매출 발생!`);
        updateUI();
        saveGame();
    }

    function triggerPenaltyEvent() {
        isPenalty = true;
        penaltyMultiplier = 0.7;
        penaltyTimeLeft = 15;
        
        const refundAmount = Math.min(money, Math.floor(Math.random() * 50000 + 10000));
        money -= refundAmount;

        alert(`⚠️ [고객 클레임 발생!]\n${refundAmount.toLocaleString()}원 환불 처리 및 15초간 매출 30% 감소`);
        document.getElementById("penalty-banner").style.display = "block";

        const penaltyInterval = setInterval(() => {
            penaltyTimeLeft--;
            document.getElementById("penalty-time").innerText = penaltyTimeLeft;
            if (penaltyTimeLeft <= 0) {
                clearInterval(penaltyInterval);
                isPenalty = false;
                penaltyMultiplier = 1;
                document.getElementById("penalty-banner").style.display = "none";
            }
        }, 1000);
    }

    setInterval(() => {
        const currentCps = getBaseCPS();
        if (currentCps > 0) {
            money += currentCps;
            dailyMoney += currentCps;
        }

        dayTimer--;
        if (dayTimer <= 0) {
            advanceDay();
        }

        updateUI();
        saveGame();
    }, 1000);

    function advanceDay() {
        salesLedger.unshift({
            date: `${currentYear}년 ${currentMonth}월 ${currentDay}일`,
            sales: dailyMoney
        });

        if (salesLedger.length > 100) salesLedger.pop();

        dailyMoney = 0;
        dayTimer = DAY_DURATION_SEC;

        let nextDate = new Date(currentYear, currentMonth - 1, currentDay + 1);
        currentYear = nextDate.getFullYear();
        currentMonth = nextDate.getMonth() + 1;
        currentDay = nextDate.getDate();

        alert(`🌅 새로운 날이 밝았습니다! (${currentYear}년 ${currentMonth}월 ${currentDay}일)`);
    }

    function updateUI() {
        document.getElementById("money-text").innerText = money.toLocaleString();
        document.getElementById("daily-money-text").innerText = dailyMoney.toLocaleString();
        document.getElementById("cps-text").innerText = getBaseCPS().toLocaleString();
        document.getElementById("store-badge").innerText = `🍗 ${storeCount}개 지점 운영 중`;
        document.getElementById("day-text").innerText = `📅 ${currentYear}년 ${currentMonth}월 ${currentDay}일 (남은시간: ${dayTimer}s)`;

        const currentMenu = chickenMenuData[menuLevel];
        document.getElementById("chicken-img").src = currentMenu.img;
        document.getElementById("menu-title-overlay").innerText = currentMenu.name;
        
        const clickEarn = Math.floor(currentMenu.power * feverMultiplier * penaltyMultiplier);
        document.getElementById("click-btn").innerText = `🍗 ${currentMenu.name} 조리 (+${clickEarn.toLocaleString()}원)`;

        const menuBtn = document.getElementById("menu-btn");
        if (menuLevel < chickenMenuData.length - 1) {
            const nextMenu = chickenMenuData[menuLevel + 1];
            menuBtn.innerText = `📜 ${nextMenu.name} (${nextMenu.cost.toLocaleString()}원)`;
            menuBtn.disabled = money < nextMenu.cost;
        } else {
            menuBtn.innerText = `✨ 모든 메뉴 개발 완료!`;
            menuBtn.disabled = true;
        }

        const hireBtn = document.getElementById("hire-btn");
        hireBtn.innerText = `👨‍🍳 주방 알바 고용 (${partTimeCost.toLocaleString()}원 / 보유: ${partTimeCount}명)`;
        hireBtn.disabled = money < partTimeCost;

        const sideBtn = document.getElementById("side-btn");
        if (sideLevel < sideUpgradeData.length) {
            const nextSide = sideUpgradeData[sideLevel];
            sideBtn.innerText = `🥤 ${nextSide.name} (${nextSide.cost.toLocaleString()}원)`;
            sideBtn.disabled = money < nextSide.cost;
        } else {
            sideBtn.innerText = `✨ 모든 사이드 추가 완료!`;
            sideBtn.disabled = true;
        }

        const storeBtn = document.getElementById("store-btn");
        storeBtn.innerText = `🚀 ${storeCount + 1}호 가맹점 개업 (${storeCost.toLocaleString()}원)`;
        storeBtn.disabled = money < storeCost;
    }

    function openLedger() {
        const ledgerList = document.getElementById("ledger-list");
        if (salesLedger.length === 0) {
            ledgerList.innerHTML = `<p style="color:#868e96; text-align:center; padding:10px;">기록된 매출 데이터가 없습니다.</p>`;
        } else {
            ledgerList.innerHTML = salesLedger.map(item => `
                <div class="ledger-item">
                    <span>${item.date}</span>
                    <strong style="color:#d9480e;">${item.sales.toLocaleString()} 원</strong>
                </div>
            `).join('');
        }
        document.getElementById("ledger-modal").style.display = "flex";
    }

    function openBook() {
        const bookGrid = document.getElementById("book-grid");
        bookGrid.innerHTML = chickenMenuData.map((menu, idx) => `
            <div class="book-card ${idx > menuLevel ? 'locked' : ''}">
                <div style="font-size: 16px;">🍗</div>
                <strong>${idx <= menuLevel ? menu.name : '????'}</strong>
                <div style="color: #868e96; margin-top: 2px;">
                    ${idx <= menuLevel ? '+' + menu.power.toLocaleString() + '원' : '미해금'}
                </div>
            </div>
        `).join('');
        document.getElementById("book-modal").style.display = "flex";
    }

    function closeModal(id) {
        document.getElementById(id).style.display = "none";
    }

    function resetGame() {
        if (confirm("모든 진행 상황을 초기화하시겠습니까?")) {
            localStorage.removeItem("cheogajipTycoon_v11");
            location.reload();
        }
    }

    loadGame();
</script>

</body>
</html>
